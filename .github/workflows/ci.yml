name: CI

# Type-checks and builds the project on every push and pull request, so a
# broken change is caught before it ships. No secrets required.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install (not npm ci) so platform-specific native/optional deps
      # resolve on the Linux runner — the lockfile is generated on macOS.
      - run: npm install --no-audit --no-fund
      - run: npm run build
