name: Deploy to production

# Auto-deploys to Vercel production on every push to main, then points
# rootlabs-design-system.vercel.app at the new deployment.
#
# This is INERT until you add one repository secret:
#   gh secret set VERCEL_TOKEN --repo rohitmudliyar-mw/rootlabs-design-system
# (create the token at https://vercel.com/account/tokens)
# Without the secret, the deploy job is skipped — never a red failure.

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.c.outputs.enabled }}
    steps:
      - id: c
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERCEL_TOKEN secret not set — skipping deploy. Add it to enable autodeploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: ${{ needs.check.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_P897S3qAleekfEVrti9gbSyH
      VERCEL_PROJECT_ID: prj_U4TwWOeHlXU9jMnJwpqZBgaw5NIX
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DOMAIN: rootlabs-design-system.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt to production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Point the domain at the new deployment
        run: vercel alias set "${{ steps.deploy.outputs.url }}" "$DOMAIN" --token="$VERCEL_TOKEN"
